name: CI/CD Pipeline (Frontend & Smart Contract)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend-build-and-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Frontend
        working-directory: apps/web
        run: npm run build

  smart-contract-build:
    name: Smart Contract Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: |
          wget -q https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz
          sudo mv $(find . -name 'stellar' -type f | head -1) /usr/local/bin/
          stellar --version

      - name: Build Smart Contract
        working-directory: contracts/advaya
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Optimize Smart Contract
        working-directory: contracts/advaya
        run: stellar contract optimize --wasm target/wasm32-unknown-unknown/release/advaya.wasm

      - name: Verify Artifacts
        working-directory: contracts/advaya
        run: |
          ls -la target/wasm32-unknown-unknown/release/advaya.wasm
          ls -la target/wasm32-unknown-unknown/release/advaya.optimized.wasm
          echo "✅ Smart contract compiled and optimized successfully"

  smart-contract-deploy:
    name: Smart Contract Deploy
    needs: smart-contract-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: |
          wget -q https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz
          sudo mv $(find . -name 'stellar' -type f | head -1) /usr/local/bin/
          stellar --version

      - name: Build & Optimize
        working-directory: contracts/advaya
        run: |
          cargo build --target wasm32-unknown-unknown --release
          stellar contract optimize --wasm target/wasm32-unknown-unknown/release/advaya.wasm

      - name: Deploy to Stellar Testnet
        working-directory: contracts/advaya
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          if [ -z "$STELLAR_SECRET_KEY" ]; then
            echo "Error: STELLAR_SECRET_KEY is not set in GitHub Secrets."
            echo "Please add it in your repository settings: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          
          echo "Deploying to Testnet..."
          stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/advaya.optimized.wasm \
            --source "$STELLAR_SECRET_KEY" \
            --network testnet > deploy_output.txt
          
          CONTRACT_ID=$(cat deploy_output.txt)
          echo "✅ Deployment Successful!"
          echo "New Contract ID: $CONTRACT_ID"
