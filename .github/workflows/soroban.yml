name: CI/CD Pipeline (Frontend & Smart Contract)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend-build-and-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Frontend
        working-directory: apps/web
        # This acts as a test for the frontend to ensure it compiles successfully without type errors
        run: npm run build

  smart-contract-test:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Tests
        working-directory: contracts/advaya
        run: cargo test

  smart-contract-deploy:
    name: Smart Contract Build & Deploy
    needs: smart-contract-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI (Pre-compiled)
        run: |
          wget https://github.com/stellar/stellar-cli/releases/download/v22.0.0/stellar-cli-22.0.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xvzf stellar-cli-22.0.0-x86_64-unknown-linux-gnu.tar.gz
          sudo mv stellar-cli-22.0.0-x86_64-unknown-linux-gnu/stellar /usr/local/bin/

      - name: Build & Optimize Smart Contract
        working-directory: contracts/advaya
        run: |
          cargo build --target wasm32-unknown-unknown --release
          stellar contract build --optimize

      - name: Deploy to Stellar Testnet
        working-directory: contracts/advaya
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          if [ -z "$STELLAR_SECRET_KEY" ]; then
            echo "Error: STELLAR_SECRET_KEY is not set in GitHub Secrets."
            echo "Please add it in your repository settings: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          
          echo "Deploying optimized WASM to Testnet..."
          stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/advaya.optimized.wasm \
            --source "$STELLAR_SECRET_KEY" \
            --network testnet > deploy_output.txt
          
          CONTRACT_ID=$(cat deploy_output.txt)
          echo "✅ Deployment Successful!"
          echo "New Contract ID: $CONTRACT_ID"
          echo ""
          echo "Note: You must manually update NEXT_PUBLIC_SOROBAN_CONTRACT_ID in your frontend environment variables."
